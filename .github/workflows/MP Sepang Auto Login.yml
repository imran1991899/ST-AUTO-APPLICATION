name: MP Sepang Auto Login

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  login:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Run Login Script
        env:
          MPSEPANG_USER: ${{ secrets.MPSEPANG_USER }}
          MPSEPANG_PASSWORD: ${{ secrets.MPSEPANG_PASSWORD }}
        run: |
          python MP Sepang Auto Login.py

      - name: Upload Captured Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: login-snapshots
          path: |
            success_login.png
            permohonan_baru.png
