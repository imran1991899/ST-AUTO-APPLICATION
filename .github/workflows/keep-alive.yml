name: Streamlit Keep-Alive

on:
  schedule:
    # Runs every hour; Python logic decides randomly whether to execute or skip
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

jobs:
  ping-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Playwright Dependencies
        run: |
          pip install playwright
          playwright install chromium

      - name: Run Keep-Alive and Capture Screenshots
        run: |
          python -c '
          import random
          import time
          from playwright.sync_api import sync_playwright

          # Random probabilistic decision (~45% chance to run per hour)
          should_run = random.choices([True, False], weights=[45, 55], k=1)[0]
          if not should_run:
              print("Random decision: Skipping this time slot to maintain an unpredictable pattern.")
              exit(0)

          print("Random decision: Proceeding with session execution.")

          # Random startup jitter (10 to 180 seconds)
          delay = random.randint(10, 180)
          print(f"Browser launching in {delay} seconds...")
          time.sleep(delay)

          urls = [
              "https://st-auto-application-np4xyno3ptrqqq7ebjgpjy.streamlit.app/",
              "https://st-auto-application-np4xyno3ptrqqq7ebjgpjy.streamlit.app/?state=XFXO1GxvpHi0UO4VIaVCC4dV4cZFQC&iss=https://accounts.google.com&code=4/0AXlqoi5laLudYdEYJJi2olXaphRvXW6DT5CZyly1cfeadZXMnaTOzFJ-kXU1SYmO4ZTTwA&scope=https://www.googleapis.com/auth/drive.file%20https://www.googleapis.com/auth/spreadsheets"
          ]

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              
              for index, target_url in enumerate(urls, start=1):
                  print(f"\n--- Processing Link {index}: {target_url} ---")
                  page = browser.new_page(viewport={"width": 1280, "height": 800})
                  
                  try:
                      # Use domcontentloaded for heavy web apps to prevent hanging
                      page.goto(target_url, timeout=45000, wait_until="domcontentloaded")
                      
                      # Buffer time: Explicitly wait for Streamlit WebSocket/React layout to finish rendering
                      print("Waiting for Streamlit components to render...")
                      time.sleep(8)

                      # Simulate human reading dwell time
                      dwell_time = random.uniform(5.0, 15.0)
                      print(f"Simulating user reading dwell time for {dwell_time:.2f} seconds...")
                      time.sleep(dwell_time)

                      # Take viewport-only screenshot (< 2MB, typically ~200-400 KB)
                      screenshot_path = f"streamlit_screenshot_{index}.png"
                      page.screenshot(path=screenshot_path, full_page=False)
                      print(f"Screenshot successfully saved to {screenshot_path}")

                  except Exception as e:
                      print(f"Session encountered an error on link {index}: {e}")
                  finally:
                      page.close()

              browser.close()
          '

      - name: Upload Screenshots as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: streamlit-screenshots
          path: streamlit_screenshot_*.png
          retention-days: 3
          if-no-files-found: ignore
