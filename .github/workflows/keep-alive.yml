name: Streamlit Keep-Alive

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  ping-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Playwright Dependencies
        run: |
          pip install playwright
          playwright install chromium

      - name: Run Keep-Alive and Capture Screenshots
        run: |
          python -c '
          import os
          import random
          import time
          from playwright.sync_api import sync_playwright

          # Randomly choose between a 3-hour or 4-hour interval (never exceeds 4 hours)
          target_interval = random.choice([3, 4])
          if target_interval == 4:
              print("Random decision: Delaying by 1 hour to make this a 4-hour interval.")
              time.sleep(3600)
          else:
              print("Random decision: Proceeding with 3-hour interval.")

          delay = random.randint(10, 180)
          print(f"Browser launching in {delay} seconds...")
          time.sleep(delay)

          urls = [
              "https://st-auto-application-np4xyno3ptrqqq7ebjgpjy.streamlit.app/",
              "https://st-auto-application-np4xyno3ptrqqq7ebjgpjy.streamlit.app/?state=XFXO1GxvpHi0UO4VIaVCC4dV4cZFQC&iss=https://accounts.google.com&code=4/0AXlqoi5laLudYdEYJJi2olXaphRvXW6DT5CZyly1cfeadZXMnaTOzFJ-kXU1SYmO4ZTTwA&scope=https://www.googleapis.com/auth/drive.file%20https://www.googleapis.com/auth/spreadsheets"
          ]

          workspace_dir = os.getcwd()
          print(f"Workspace directory: {workspace_dir}")

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              
              for index, target_url in enumerate(urls, start=1):
                  print(f"\n--- Processing Link {index}: {target_url} ---")
                  page = browser.new_page(viewport={"width": 1280, "height": 800})
                  screenshot_filename = f"streamlit_screenshot_{index}.png"
                  screenshot_path = os.path.join(workspace_dir, screenshot_filename)
                  
                  try:
                      page.goto(target_url, timeout=60000, wait_until="domcontentloaded")
                      
                      print("Waiting for Streamlit app container and WebSocket connection...")
                      page.wait_for_selector("[data-testid=\"stAppViewContainer\"]", timeout=45000)
                      
                      print("Simulating human activity (mouse movement, clicks, and scrolling)...")
                      page.mouse.move(200, 200)
                      page.mouse.move(500, 400, steps=15)
                      page.mouse.down()
                      page.mouse.up()
                      
                      page.mouse.wheel(0, 400)
                      time.sleep(3)
                      page.mouse.wheel(0, -400)
                      
                      dwell_time = random.uniform(25.0, 45.0)
                      print(f"Holding active session for {dwell_time:.2f} seconds...")
                      time.sleep(dwell_time)

                      page.screenshot(path=screenshot_path, full_page=False)
                      print(f"Success! Screenshot saved to {screenshot_path}")

                  except Exception as e:
                      print(f"Encountered issue on link {index}: {e}")
                      try:
                          page.screenshot(path=screenshot_path, full_page=False)
                          print(f"Fallback screenshot saved to {screenshot_path}")
                      except Exception as inner_e:
                          print(f"Could not save fallback screenshot: {inner_e}")
                  finally:
                      page.close()

              browser.close()
          '

      - name: Upload Screenshots as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: streamlit-screenshots
          path: streamlit_screenshot_*.png
          retention-days: 3
          if-no-files-found: ignore
