name: OAS Ollama Auto Login

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  login:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Cache Ollama Models
        uses: actions/cache@v4
        id: ollama-cache
        with:
          path: ~/.ollama
          key: ollama-${{ runner.os }}-moondream

      - name: Start Ollama Service and Pull Lightweight Vision Model
        run: |
          ollama serve &
          echo "Waiting for Ollama service to start..."
          sleep 5
          # If the model is already cached, ollama will skip downloading it
          ollama pull moondream

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Run Login Script with Ollama
        env:
          OAS_EMAIL: ${{ secrets.OAS_EMAIL }}
          OAS_PASSWORD: ${{ secrets.OAS_PASSWORD }}
        run: |
          python login.py

      - name: Upload Captured Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: login-snapshots
          path: |
            captcha.png
            success_login.png
